<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>k6 Studio</title>
  <style>
    :root {
      --bg:#1e1e1e;--panel:#252526;--border:#3c3c3c;
      --text:#d4d4d4;--muted:#9da5b4;--accent:#0e639c;
      --accent-hover:#1177bb;--danger:#c72e2e;--danger-hover:#e03e3e;
      --success:#3fb950;--warn:#f0ad4e;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
    header{background:var(--panel);border-bottom:1px solid var(--border);padding:.5rem 1rem;position:relative}
    .title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
    .title-row h1{margin:0;font-size:1.1rem;font-weight:600}
    .script-meta{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.9rem}
    .unsaved-label{display:none;font-size:.8rem;color:var(--warn)}
    .unsaved-label.visible{display:inline}
    .toolbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
    .sep{width:1px;height:1.2rem;background:var(--border);margin:0 .25rem}
    button{background:var(--accent);color:#fff;border:none;border-radius:4px;padding:.35rem .75rem;font-size:.85rem;cursor:pointer}
    button:hover:not(:disabled){background:var(--accent-hover)}
    button:disabled{opacity:.45;cursor:not-allowed}
    button.danger{background:var(--danger)}
    button.danger:hover:not(:disabled){background:var(--danger-hover)}
    button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
    button.ghost:hover:not(:disabled){background:#2a2d2e}
    button:focus-visible,.tree-item:focus-visible{outline:2px solid #0e639c;outline-offset:2px}
    .status-badge{font-size:.75rem;padding:.2rem .5rem;border-radius:3px;background:#333;color:var(--muted)}
    .status-badge.running{background:#0d3d1f;color:var(--success)}
    .status-badge.stopping{background:#3d2a00;color:var(--warn)}
    .status-badge.failed{background:#3d0d0d;color:#f85149}
    .main{flex:1;display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr 200px;min-height:0}
    .sidebar{grid-row:1/3;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
    .sidebar-section{padding:.5rem 0}
    .sidebar-section+.sidebar-section{border-top:1px solid var(--border)}
    .section-header{display:flex;align-items:center;justify-content:space-between;padding:.25rem .75rem}
    .section-header h2{margin:0;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
    .section-actions{display:flex;gap:.25rem}
    .section-actions button{padding:.15rem .4rem;font-size:.75rem;background:transparent;border:1px solid var(--border);color:var(--muted)}
    .tree{list-style:none;margin:0;padding:0}
    .tree-item{display:flex;align-items:center;padding:.3rem .5rem;cursor:pointer;font-size:.85rem;gap:.35rem;user-select:none}
    .tree-item:hover{background:#2a2d2e}
    .tree-item.active{background:#094771}
    .tree-item .icon{flex-shrink:0}
    .tree-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tree-item .del-btn{opacity:0;background:transparent;border:none;color:var(--muted);padding:0 .25rem;font-size:.85rem;cursor:pointer}
    .tree-item:hover .del-btn{opacity:1}
    .tree-item .ext-btn{opacity:0;background:transparent;border:none;color:var(--muted);padding:0 .25rem;font-size:.85rem;cursor:pointer}
    .tree-item:hover .ext-btn{opacity:1}
    .tree-children{padding-left:1rem}
    #editor{min-height:0;border-bottom:1px solid var(--border)}
    .output-panel{display:flex;flex-direction:column;min-height:0;background:#111}
    .output-header{display:flex;align-items:center;justify-content:space-between;padding:.35rem .75rem;background:var(--panel);border-bottom:1px solid var(--border);font-size:.85rem}
    #output{flex:1;overflow-y:auto;padding:.5rem .75rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;white-space:pre-wrap;word-break:break-word}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}
    .modal-backdrop.open{display:flex}
    .modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem;min-width:320px;max-width:90vw}
    .modal h3{margin:0 0 .75rem;font-size:1rem}
    .modal p{margin:0 0 1rem;color:var(--muted);font-size:.9rem}
    .modal-actions{display:flex;justify-content:flex-end;gap:.5rem}
    .modal input{width:100%;margin-bottom:1rem;padding:.45rem .6rem;border-radius:4px;border:1px solid var(--border);background:#1e1e1e;color:var(--text);font-size:.9rem}
    .toast{position:fixed;bottom:1rem;right:1rem;background:#2d333b;border:1px solid var(--border);padding:.6rem 1rem;border-radius:6px;display:none;z-index:200;font-size:.9rem}
    .toast.show{display:block}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .announce{position:absolute;left:-9999px}
    .shortcuts-popover{position:absolute;top:3.5rem;right:1rem;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:.75rem 1rem;font-size:.85rem;display:none;z-index:50;min-width:220px}
    .shortcuts-popover.open{display:block}
    .shortcuts-popover dl{margin:0}
    .shortcuts-popover dt{font-weight:600;margin-top:.35rem}
    .shortcuts-popover dd{margin:.15rem 0 0;color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <div class="script-meta">
        <h1>k6 Studio</h1>
        <span id="current-script-name">—</span>
        <span id="unsaved-label" class="unsaved-label" aria-live="polite">Unsaved</span>
      </div>
      <button type="button" id="help-btn" class="ghost" aria-label="Keyboard shortcuts">?</button>
    </div>
    <div class="toolbar">
      <button type="button" id="save-btn">Save</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="run-btn"><span aria-hidden="true">▶</span> Run</button>
      <button type="button" id="stop-btn" disabled><span aria-hidden="true">■</span> Stop</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="dashboard-btn" class="ghost" title="Dashboard is only active while a test is running">Dashboard ↗</button>
      <span id="run-status" class="status-badge">Idle</span>
    </div>
    <div id="shortcuts-popover" class="shortcuts-popover" role="region" aria-label="Keyboard shortcuts">
      <dl>
        <dt>Save</dt><dd>Cmd/Ctrl+S</dd>
        <dt>Run</dt><dd>Cmd/Ctrl+Enter</dd>
        <dt>Close modal</dt><dd>Escape</dd>
        <dt>Command palette</dt><dd>F1 (in editor)</dd>
      </dl>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar" aria-label="File explorer">
      <div class="sidebar-section">
        <div class="section-header">
          <h2>Scripts</h2>
          <div class="section-actions">
            <button type="button" id="new-script-btn" title="New script">+ Script</button>
            <button type="button" id="new-folder-btn" title="New folder">+ Folder</button>
          </div>
        </div>
        <ul id="script-tree" class="tree" role="tree" aria-label="Scripts"></ul>
      </div>
      <div class="sidebar-section">
        <div class="section-header"><h2>Reports</h2></div>
        <ul id="report-tree" class="tree" role="tree" aria-label="Reports"></ul>
      </div>
    </aside>

    <div id="editor" aria-label="Script editor. Press F1 for command palette."></div>

    <section class="output-panel" aria-label="Test output">
      <div class="output-header">
        <span>Output</span>
        <button type="button" id="clear-output-btn" class="ghost">Clear</button>
      </div>
      <div id="output" role="log" aria-live="off" aria-label="k6 test output"></div>
    </section>
  </div>

  <div id="delete-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="delete-title">
    <div class="modal">
      <h3 id="delete-title">Delete?</h3>
      <p id="delete-message"></p>
      <div class="modal-actions">
        <button type="button" id="delete-cancel-btn" class="ghost">Cancel</button>
        <button type="button" id="delete-confirm-btn" class="danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="switch-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="switch-title">
    <div class="modal">
      <h3 id="switch-title">Unsaved changes</h3>
      <p id="switch-message"></p>
      <div class="modal-actions">
        <button type="button" id="switch-discard-btn" class="ghost">Discard</button>
        <button type="button" id="switch-save-btn">Save &amp; Switch</button>
      </div>
    </div>
  </div>

  <div id="new-script-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="new-script-title">
    <div class="modal">
      <h3 id="new-script-title">New script</h3>
      <label for="new-script-input" class="sr-only">Script path (e.g. payments/refund.js)</label>
      <input id="new-script-input" type="text" placeholder="payments/refund.js" autocomplete="off">
      <div class="modal-actions">
        <button type="button" id="new-script-cancel-btn" class="ghost">Cancel</button>
        <button type="button" id="new-script-confirm-btn">Create</button>
      </div>
    </div>
  </div>

  <div id="new-folder-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="new-folder-title">
    <div class="modal">
      <h3 id="new-folder-title">New folder</h3>
      <label for="new-folder-input" class="sr-only">Folder path (e.g. payments)</label>
      <input id="new-folder-input" type="text" placeholder="payments" autocomplete="off">
      <div class="modal-actions">
        <button type="button" id="new-folder-cancel-btn" class="ghost">Cancel</button>
        <button type="button" id="new-folder-confirm-btn">Create</button>
      </div>
    </div>
  </div>

  <div id="toast-container" role="status" aria-live="polite">
    <div id="toast" class="toast"></div>
  </div>
  <div id="announce" class="announce" aria-live="assertive" aria-atomic="true"></div>

  <script src="./monaco-editor/vs/loader.js"></script>
  <script>
  'use strict';
  (() => {
  const CSRF = {'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'};
  const BOILERPLATE = `import http from 'k6/http';
import { check, sleep } from 'k6';

const TARGET_URL = __ENV.K6_TARGET_URL || 'http://host.docker.internal:8084/healthz';

export const options = {
  vus: 10,
  duration: '30s',
  thresholds: {
    http_req_duration: ['p(95)<500'],
    http_req_failed: ['rate<0.01'],
    http_reqs: ['rate>0'],
  },
};

export default function () {
  const res = http.get(TARGET_URL);
  check(res, {
    'status is 200': (r) => r.status === 200,
    'response time < 1s': (r) => r.timings.duration < 1000,
  });
  sleep(1);
}
`;

  let editor=null, currentScript=null, savedContent='', isDirty=false;
  let runState='idle', eventSource=null, pollTimer=null;
  let pendingSwitch=null, pendingDeletePath=null;
  let focusTrapHandler=null, autoScroll=true;
  let expandedDirs=JSON.parse(localStorage.getItem('k6-expanded')||'{}');
  function saveExpanded(){localStorage.setItem('k6-expanded',JSON.stringify(expandedDirs));}

  const $=(id)=>document.getElementById(id);
  const el={
    currentName:$('current-script-name'),unsavedLabel:$('unsaved-label'),
    output:$('output'),runStatus:$('run-status'),runBtn:$('run-btn'),
    stopBtn:$('stop-btn'),saveBtn:$('save-btn'),dashboardBtn:$('dashboard-btn'),
    clearBtn:$('clear-output-btn'),helpBtn:$('help-btn'),shortcuts:$('shortcuts-popover'),
    scriptTree:$('script-tree'),reportTree:$('report-tree'),toast:$('toast'),announce:$('announce'),
    deleteModal:$('delete-modal'),deleteMessage:$('delete-message'),
    deleteCancel:$('delete-cancel-btn'),deleteConfirm:$('delete-confirm-btn'),
    switchModal:$('switch-modal'),switchMessage:$('switch-message'),
    switchDiscard:$('switch-discard-btn'),switchSave:$('switch-save-btn'),
    newScriptModal:$('new-script-modal'),newScriptInput:$('new-script-input'),
    newScriptCancel:$('new-script-cancel-btn'),newScriptConfirm:$('new-script-confirm-btn'),
    newFolderModal:$('new-folder-modal'),newFolderInput:$('new-folder-input'),
    newFolderCancel:$('new-folder-cancel-btn'),newFolderConfirm:$('new-folder-confirm-btn'),
  };

  function showToast(msg){el.toast.textContent=msg;el.toast.classList.add('show');setTimeout(()=>el.toast.classList.remove('show'),3000);}
  function announce(msg){el.announce.textContent='';requestAnimationFrame(()=>{el.announce.textContent=msg;});}
  function setDirty(d){isDirty=d;el.unsavedLabel.classList.toggle('visible',d);}
  function appendOutput(line){el.output.textContent+=(el.output.textContent?'\n':'')+line;if(autoScroll)el.output.scrollTop=el.output.scrollHeight;}
  function clearOutput(){el.output.textContent='';}

  function setRunState(state,opts={}){
    runState=state;
    const idle=state==='idle',running=state==='running';
    el.runBtn.disabled=!idle;
    el.runBtn.title=idle?'':'A test is already running';
    el.stopBtn.disabled=!running;
    el.dashboardBtn.title=running?'':'Dashboard is only active while a test is running';
    const labels={idle:'Idle',running:'Running',stopping:'Stopping'};
    el.runStatus.textContent=labels[state]||state;
    el.runStatus.className='status-badge'+(running?' running':state==='stopping'?' stopping':opts.failed?' failed':'');
    if(idle){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}if(opts.refreshReports)loadReportTree();}
  }

  function openModal(modal,initialFocus){
    modal.classList.add('open');
    const focusable=Array.from(modal.querySelectorAll('button,input,[tabindex]:not([tabindex="-1"])'));
    (initialFocus||focusable[0])?.focus();
    focusTrapHandler=(e)=>{
      if(e.key!=='Tab'||!modal.classList.contains('open'))return;
      const first=focusable[0],last=focusable[focusable.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    };
    document.addEventListener('keydown',focusTrapHandler);
  }
  function closeModal(modal,returnFocus){
    modal.classList.remove('open');
    if(focusTrapHandler){document.removeEventListener('keydown',focusTrapHandler);focusTrapHandler=null;}
    returnFocus?.focus();
  }

  function renderNode(node,ul,depth){
    if(node.type==='dir'){
      const li=document.createElement('li');
      li.setAttribute('role','treeitem');
      // Key on full path for expand state, not just name
      const key=node.path||node.name;
      const isOpen=expandedDirs[key]!==false;
      li.setAttribute('aria-expanded',String(isOpen));
      const row=document.createElement('div');
      row.className='tree-item';
      row.style.paddingLeft=`${.5+depth}rem`;
      row.setAttribute('tabindex','-1');
      const icon=document.createElement('span');
      icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent=isOpen?'📂':'📁';
      const label=document.createElement('span');
      label.className='label';label.textContent=node.name+'/';
      const delBtn=document.createElement('button');
      delBtn.type='button';delBtn.className='del-btn';
      delBtn.setAttribute('aria-label',`Delete ${node.name}/`);
      delBtn.textContent='×';
      delBtn.addEventListener('click',(e)=>{
        e.stopPropagation();
        pendingDeletePath=node.path||node.name;
        el.deleteMessage.textContent=`Delete folder '${node.name}/' and all its contents?`;
        openModal(el.deleteModal,el.deleteCancel);
      });
      row.appendChild(icon);row.appendChild(label);row.appendChild(delBtn);
      row.addEventListener('click',()=>{expandedDirs[key]=!isOpen;saveExpanded();loadScriptTree();});
      li.appendChild(row);
      if(isOpen){
        const childUl=document.createElement('ul');
        childUl.className='tree-children tree';childUl.setAttribute('role','group');
        for(const child of(node.children||[]))renderNode(child,childUl,depth+1);
        li.appendChild(childUl);
      }
      ul.appendChild(li);
    } else {
      const li=document.createElement('li');li.setAttribute('role','treeitem');
      const row=document.createElement('div');
      row.className='tree-item'+(node.path===currentScript?' active':'');
      row.style.paddingLeft=`${.5+depth}rem`;row.setAttribute('tabindex','-1');
      const icon=document.createElement('span');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent='📄';
      const label=document.createElement('span');label.className='label';label.textContent=node.name;
      const delBtn=document.createElement('button');
      delBtn.type='button';delBtn.className='del-btn';
      delBtn.setAttribute('aria-label',`Delete ${node.name}`);delBtn.textContent='×';
      delBtn.addEventListener('click',(e)=>{
        e.stopPropagation();
        pendingDeletePath=node.path;
        el.deleteMessage.textContent=`Delete '${node.name}'? This cannot be undone.`;
        openModal(el.deleteModal,el.deleteCancel);
      });
      row.appendChild(icon);row.appendChild(label);row.appendChild(delBtn);
      row.addEventListener('click',()=>switchToScript(node.path));
      li.appendChild(row);ul.appendChild(li);
    }
  }

  async function loadScriptTree(){
    const res=await fetch('/api/tree');
    const tree=await res.json();
    el.scriptTree.innerHTML='';
    for(const child of(tree.children||[]))renderNode(child,el.scriptTree,0);
  }

  function renderReportNode(node,ul,depth){
    if(node.type==='dir'){
      const li=document.createElement('li');li.setAttribute('role','treeitem');
      const key='report-'+(node.path||node.name);
      const isOpen=expandedDirs[key]!==false;
      const row=document.createElement('div');
      row.className='tree-item';row.style.paddingLeft=`${.5+depth}rem`;row.setAttribute('tabindex','-1');
      const icon=document.createElement('span');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent=isOpen?'📂':'📁';
      const label=document.createElement('span');label.className='label';label.textContent=node.name+'/';
      row.appendChild(icon);row.appendChild(label);
      row.addEventListener('click',()=>{expandedDirs[key]=!isOpen;saveExpanded();loadReportTree();});
      li.appendChild(row);
      if(isOpen){
        const childUl=document.createElement('ul');childUl.className='tree-children tree';childUl.setAttribute('role','group');
        for(const child of(node.children||[]))renderReportNode(child,childUl,depth+1);
        li.appendChild(childUl);
      }
      ul.appendChild(li);
    } else {
      const li=document.createElement('li');li.setAttribute('role','treeitem');
      const row=document.createElement('div');
      row.className='tree-item';row.style.paddingLeft=`${.5+depth}rem`;row.setAttribute('tabindex','-1');
      const icon=document.createElement('span');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent='📄';
      if(!node.htmlUrl){
        const label=document.createElement('span');label.className='label';label.style.color='var(--muted)';label.textContent='(no report)';
        row.appendChild(icon);row.appendChild(label);
      } else {
        const label=document.createElement('span');label.className='label';label.title=node.name;label.textContent=node.label||node.name;
        const extBtn=document.createElement('button');
        extBtn.type='button';extBtn.className='ext-btn';
        extBtn.setAttribute('aria-label',`Open ${node.name} in new tab`);
        extBtn.textContent='↗';
        extBtn.addEventListener('click',(e)=>{e.stopPropagation();window.open(node.htmlUrl,'_blank','noopener');});
        row.appendChild(icon);row.appendChild(label);row.appendChild(extBtn);
        row.addEventListener('click',()=>window.open(node.htmlUrl,'_blank','noopener'));
      }
      li.appendChild(row);ul.appendChild(li);
    }
  }

  async function loadReportTree(){
    const res=await fetch('/api/reports');
    const tree=await res.json();
    el.reportTree.innerHTML='';
    for(const child of(tree.children||[]))renderReportNode(child,el.reportTree,0);
  }

  async function loadScript(scriptPath){
    const res=await fetch(`/api/scripts/${scriptPath}`);
    if(!res.ok){showToast('Failed to load script');return;}
    const content=await res.text();
    currentScript=scriptPath;savedContent=content;
    editor.setValue(content);setDirty(false);
    el.currentName.textContent=scriptPath;
    await loadScriptTree();
  }

  async function saveScript(){
    if(!currentScript)return false;
    const content=editor.getValue();
    const res=await fetch(`/api/scripts/${currentScript}`,{method:'PUT',headers:CSRF,body:JSON.stringify({content})});
    if(!res.ok){showToast('Save failed');return false;}
    savedContent=content;setDirty(false);showToast('Saved');return true;
  }

  async function switchToScript(scriptPath){
    if(scriptPath===currentScript)return;
    if(isDirty){
      pendingSwitch=scriptPath;
      el.switchMessage.textContent=`Save changes to '${currentScript}' before switching?`;
      openModal(el.switchModal,el.switchSave);return;
    }
    await loadScript(scriptPath);
  }

  async function deleteItem(){
    if(!pendingDeletePath)return;
    const trigger=document.activeElement;
    const res=await fetch(`/api/scripts/${pendingDeletePath}`,{method:'DELETE',headers:CSRF});
    closeModal(el.deleteModal,trigger);
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      showToast(err.error==='script_running'?'Cannot delete — test is running':(err.error||'Delete failed'));
      pendingDeletePath=null;return;
    }
    const wasCurrent=currentScript&&currentScript.startsWith(pendingDeletePath+'/');
    if(!wasCurrent&&currentScript===pendingDeletePath)wasCurrent||0,wasCurrent===undefined&&(currentScript===pendingDeletePath);
    // reset editor if deleted item was/contained current script
    if(currentScript&&(currentScript===pendingDeletePath||currentScript.startsWith(pendingDeletePath+'/'))){
      currentScript=null;savedContent='';editor.setValue('');el.currentName.textContent='—';setDirty(false);
    }
    pendingDeletePath=null;
    await loadScriptTree();
  }

  async function createScript(){
    const raw=el.newScriptInput.value.trim();if(!raw)return;
    const name=raw.endsWith('.js')?raw:`${raw}.js`;
    const trigger=document.activeElement;
    const res=await fetch(`/api/scripts/${name}`,{method:'PUT',headers:CSRF,body:JSON.stringify({content:BOILERPLATE})});
    if(!res.ok){const err=await res.json().catch(()=>({}));showToast(err.error==='too_deep'?'Path too deep (max 5 levels)':'Create failed');return;}
    closeModal(el.newScriptModal,trigger);
    await loadScript(name);
  }

  async function createFolder(){
    const raw=el.newFolderInput.value.trim();if(!raw)return;
    const trigger=document.activeElement;
    const res=await fetch(`/api/dirs/${raw}`,{method:'PUT',headers:CSRF});
    closeModal(el.newFolderModal,trigger);
    if(!res.ok){const err=await res.json().catch(()=>({}));showToast(err.error==='too_deep'?'Path too deep (max 5 levels)':'Create folder failed');return;}
    await loadScriptTree();
  }

  function connectSSE(){
    if(eventSource){eventSource.close();eventSource=null;}
    eventSource=new EventSource('/api/stream');
    eventSource.onmessage=(e)=>appendOutput(e.data);
    eventSource.addEventListener('done',(e)=>{
      const data=JSON.parse(e.data);const failed=data.exitCode!==0;
      if(failed){el.runStatus.textContent=`Failed (${data.exitCode})`;el.runStatus.className='status-badge failed';}
      setRunState('idle',{failed,refreshReports:true});
      announce(failed?`Test failed with exit code ${data.exitCode}`:'Test completed');
      eventSource?.close();eventSource=null;
    });
    eventSource.addEventListener('error',(e)=>{
      if(e.data){const d=JSON.parse(e.data);appendOutput(`[error] ${d.message}`);}
      setRunState('idle',{failed:true});eventSource?.close();eventSource=null;
    });
    eventSource.onerror=()=>{if(runState==='idle'){eventSource?.close();eventSource=null;}};
  }

  async function runTest(){
    if(!currentScript||runState!=='idle')return;
    if(isDirty){const saved=await saveScript();if(!saved)return;}
    clearOutput();setRunState('running');announce('Test started');
    const res=await fetch('/api/run',{method:'POST',headers:CSRF,body:JSON.stringify({name:currentScript})});
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      if(res.status===409)showToast('A test is already running');
      else appendOutput(`[error] ${err.message||err.error||res.statusText}`);
      setRunState('idle',{failed:true});return;
    }
    connectSSE();
    // Poll as fallback for SSE drops/page refresh — SSE done event is primary
    pollTimer=setInterval(async()=>{
      const sr=await fetch('/api/status').then(r=>r.json()).catch(()=>({}));
      if(sr.status==='idle')setRunState('idle',{refreshReports:true});
    },2000);
  }

  async function stopTest(){
    setRunState('stopping');announce('Stopping test…');
    await fetch('/api/stop',{method:'POST',headers:CSRF});
  }

  async function initFromStatus(){
    const sr=await fetch('/api/status').then(r=>r.json()).catch(()=>({}));
    if(sr.status!=='idle'){
      // Backfill output via /api/output (no SSE replay in runner — single source of truth)
      const output=await fetch('/api/output').then(r=>r.json()).catch(()=>({lines:[]}));
      for(const line of output.lines)appendOutput(line);
      setRunState('running');connectSSE();
      pollTimer=setInterval(async()=>{
        const s2=await fetch('/api/status').then(r=>r.json()).catch(()=>({}));
        if(s2.status==='idle')setRunState('idle',{refreshReports:true});
      },2000);
    }
  }

  document.addEventListener('keydown',(e)=>{
    const mod=e.metaKey||e.ctrlKey;
    if(mod&&e.key==='s'){e.preventDefault();saveScript();}
    if(mod&&e.key==='Enter'&&runState==='idle'){e.preventDefault();runTest();}
    if(e.key==='Escape'){
      [el.deleteModal,el.switchModal,el.newScriptModal,el.newFolderModal]
        .forEach(m=>{if(m.classList.contains('open'))closeModal(m);});
      el.shortcuts.classList.remove('open');
    }
  });

  el.saveBtn.addEventListener('click',()=>saveScript());
  el.runBtn.addEventListener('click',()=>runTest());
  el.stopBtn.addEventListener('click',()=>stopTest());
  el.dashboardBtn.addEventListener('click',()=>window.open('http://localhost:5665','_blank','noopener'));
  el.clearBtn.addEventListener('click',clearOutput);
  el.helpBtn.addEventListener('click',()=>el.shortcuts.classList.toggle('open'));
  el.deleteCancel.addEventListener('click',()=>{pendingDeletePath=null;closeModal(el.deleteModal);});
  el.deleteConfirm.addEventListener('click',deleteItem);
  el.switchDiscard.addEventListener('click',async()=>{
    const target=pendingSwitch;pendingSwitch=null;closeModal(el.switchModal);setDirty(false);
    if(target)await loadScript(target);
  });
  el.switchSave.addEventListener('click',async()=>{
    const target=pendingSwitch;const saved=await saveScript();if(!saved)return;
    pendingSwitch=null;closeModal(el.switchModal);if(target)await loadScript(target);
  });
  $('new-script-btn').addEventListener('click',()=>{el.newScriptInput.value='';openModal(el.newScriptModal,el.newScriptInput);});
  el.newScriptCancel.addEventListener('click',()=>closeModal(el.newScriptModal));
  el.newScriptConfirm.addEventListener('click',createScript);
  el.newScriptInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')createScript();});
  $('new-folder-btn').addEventListener('click',()=>{el.newFolderInput.value='';openModal(el.newFolderModal,el.newFolderInput);});
  el.newFolderCancel.addEventListener('click',()=>closeModal(el.newFolderModal));
  el.newFolderConfirm.addEventListener('click',createFolder);
  el.newFolderInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')createFolder();});
  el.output.addEventListener('scroll',()=>{
    autoScroll=el.output.scrollHeight-el.output.scrollTop-el.output.clientHeight<24;
  });

  require.config({paths:{vs:'./monaco-editor/vs'}});
  require(['vs/editor/editor.main'],async()=>{
    editor=monaco.editor.create(document.getElementById('editor'),{
      value:'',language:'javascript',theme:'vs-dark',
      automaticLayout:true,minimap:{enabled:false},fontSize:13,
    });
    editor.onDidChangeModelContent(()=>setDirty(editor.getValue()!==savedContent));
    await loadScriptTree();await loadReportTree();await initFromStatus();
    const first=el.scriptTree.querySelector('.tree-item');
    if(!currentScript&&first)first.click();
  });
  })();
  </script>
</body>
</html>
