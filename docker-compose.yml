services:
  web-ui:
    build: ./web-ui
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./tests:/tests
    environment:
      - K6_RUNNER_URL=http://k6:8080
    depends_on:
      k6:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  k6:
    build: ./k6
    init: true
    ports:
      - "127.0.0.1:5665:5665"
    volumes:
      - ./tests:/tests
    environment:
      - K6_TARGET_URL=${K6_TARGET_URL:-http://host.docker.internal:8084/healthz}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
